name: Docs quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "site-docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "scripts/check_docs.py"
      - "tests/test_check_docs.py"
      - "Taskfile.yml"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs-quality.yml"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs_quality:
    name: Docs quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Test documentation checker
        run: python -m unittest tests.test_check_docs -v

      - name: Build site
        run: zensical build --strict

      - name: Check generated documentation
        run: python scripts/check_docs.py site
