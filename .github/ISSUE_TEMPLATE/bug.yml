name: Bug report
description: Report something that is not working as expected
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in ffmpegfyMe.
        Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
      placeholder: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please redact any URLs or credentials before pasting.
      render: shell
    validations:
      required: false
  - type: input
    id: ffmpeg-version
    attributes:
      label: FFmpeg version
      description: Version of ffmpeg used (Docker image or host).
      placeholder: ffmpeg version 6.0
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Version of Python used (3.11+ expected).
      placeholder: Python 3.11
    validations:
      required: false
  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: Version of Docker used.
      placeholder: Docker version 24
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and architecture.
      placeholder: Ubuntu 24.04 on x86_64
    validations:
      required: false
